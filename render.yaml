services:
  - type: web
    name: poolshop
    runtime: docker
    plan: starter            # el disco persistente (media) no está en el plan free
    healthCheckPath: /api/v1/
    disk:
      name: media
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "false"
      - key: MEDIA_ROOT
        value: /data/media
      - key: PRIVATE_MEDIA_ROOT   # comprobantes de pago (no se sirven por /media/)
        value: /data/privado
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: poolshop-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false          # https://<tu-servicio>.onrender.com
      # La cuenta queda pendiente hasta confirmar el email (flujo seguro).
      - key: VERIFICACION_EMAIL_OBLIGATORIA
        value: "true"
      # Cuenta de servicio de correo (Gmail + contraseña de aplicación). Sin esto los
      # mails van al log y nadie puede confirmar su email. Probar con:
      #   python manage.py probar_correo <email>   (Shell del servicio en Render)
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false          # poolshopnotificaciones@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false          # contraseña de aplicación de 16 letras

  # Tareas periódicas: caducidad de pools y recordatorios (cada hora).
  - type: cron
    name: poolshop-tareas
    runtime: docker
    plan: starter
    schedule: "7 * * * *"
    dockerCommand: python manage.py tareas_periodicas
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        fromService:
          type: web
          name: poolshop
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: poolshop-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: poolshop
          envVarKey: FRONTEND_URL
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        fromService:
          type: web
          name: poolshop
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: poolshop
          envVarKey: EMAIL_HOST_PASSWORD

databases:
  - name: poolshop-db
    plan: basic-256mb
    postgresMajorVersion: "17"
