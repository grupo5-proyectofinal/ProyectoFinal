</helmet>
<div style="min-height: 100vh; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; color: #1F1512">
<dc-import name="Header" active="notificaciones" hint-size="100%,76px"></dc-import>

<main style="max-width: 1280px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.03em">Notificaciones</h1>
<p style="margin: 6px 0 0; font-size: 16px; color: #4A3A33">{{summary}}</p>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<button type="button" sc-camel-on-click="{{showAll}}" aria-pressed="{{allSel}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{allBorder}}; background: {{allBg}}; color: {{allColor}}; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Todas</button>
<button type="button" sc-camel-on-click="{{showUnread}}" aria-pressed="{{unSel}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{unBorder}}; background: {{unBg}}; color: {{unColor}}; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">No leídas</button>
<button type="button" sc-camel-on-click="{{markAll}}" style="height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #B42318; cursor: pointer">Marcar todas como leídas</button>
</div>
</div>

<div style="border: 1px solid #F0E0D6; border-radius: 20px; overflow: hidden">
<sc-for list="{{items}}" as="n" hint-placeholder-count="7">
<a href="{{n.href}}" style="display: flex; gap: 16px; align-items: flex-start; padding: 18px 20px; border-bottom: 1px solid #F6E9E1; background: {{n.bg}}; text-decoration: none; color: #1F1512">
<span style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: {{n.iconBg}}; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{n.iconInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><b style="font-size: 15px">{{n.title}}</b><span style="padding: 2px 8px; border-radius: 999px; background: {{n.tagBg}}; color: {{n.tagColor}}; font-size: 11px; font-weight: 700">{{n.tag}}</span></span>
<span style="font-size: 14px; line-height: 1.45; color: #4A3A33">{{n.text}}</span>
<span style="font-size: 12px; color: #6B5248">{{n.time}}</span>
</span>
<sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}"><span aria-label="No leída" style="flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: #DE3A3A"></span></sc-if>
</a>
</sc-for>
</div>
</section>

<aside style="flex: 1 1 300px; min-width: 0; border: 1px solid #F0E0D6; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800">Qué querés recibir</h2>
<sc-for list="{{prefs}}" as="p" hint-placeholder-count="6">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; cursor: pointer">
<span><span style="display: block">{{p.label}}</span><span style="font-size: 12px; color: #6B5248">{{p.who}}</span></span>
<input type="checkbox" checked="" style="flex: none; width: 22px; height: 22px; accent-color: #DE3A3A">
</label>
</sc-for>
<div style="padding-top: 14px; border-top: 1px solid #F3E3D9; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">Canales</span>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #DE3A3A">En la app</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #DE3A3A">Por email</label>
</div>
</aside>
</main>
</div>
</x-dc>
