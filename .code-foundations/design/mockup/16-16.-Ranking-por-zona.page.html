<style>
body{margin:0;background:#FFFFFF}
a{color:#B42318}a:hover{color:#7A1A12}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; color: #1F1512">
<dc-import name="Header" active="ranking" hint-size="100%,76px"></dc-import>

<main style="max-width: 1080px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.03em">Ranking de usuarios</h1>
<p style="margin: 6px 0 0; font-size: 16px; color: #4A3A33">Los mejor calificados de cada zona, según las reseñas de otros usuarios.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{zones}}" as="z" hint-placeholder-count="5">
<button type="button" aria-pressed="{{z.sel}}" sc-camel-on-click="{{z.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{z.border}}; background: {{z.bg}}; color: {{z.color}}; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{z.label}}</button>
</sc-for>
</div>
</div>

<section aria-label="Podio" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: end">
<sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
<div style="border-radius: 22px; background: {{p.bg}}; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-height: {{p.h}}; box-sizing: border-box; justify-content: flex-end">
<span style="width: 72px; height: 72px; border-radius: 50%; background: #FFFFFF; color: #9A3412; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 3px solid {{p.ring}}">{{p.ini}}</span>
<b style="font-size: 17px">{{p.name}}</b>
<span style="display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="#F59E0B" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7-6.2-3.6-6.2 3.6 1.4-7L2 9.3l7-.8z"></path></svg>{{p.rating}}</span>
<span style="font-size: 13px; color: #5C4038">{{p.pools}} pools · {{p.reviews}} reseñas</span>
<span style="margin-top: 6px; width: 44px; height: 44px; border-radius: 50%; background: {{p.ring}}; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.pos}}</span>
</div>
</sc-for>
</section>

<section style="border: 1px solid #F0E0D6; border-radius: 20px; overflow: hidden">
<div style="overflow-x: auto">
<sc-raw-table style="width: 100%; border-collapse: collapse; font-size: 15px; min-width: 560px">
<sc-raw-thead><sc-raw-tr style="text-align: left; color: #6B5248; font-size: 13px; background: #FFF8F4"><sc-raw-th style="padding: 14px 20px; font-weight: 500">#</sc-raw-th><sc-raw-th style="padding: 14px; font-weight: 500">Usuario</sc-raw-th><sc-raw-th style="padding: 14px; font-weight: 500">Calificación</sc-raw-th><sc-raw-th style="padding: 14px; font-weight: 500">Pools completados</sc-raw-th><sc-raw-th style="padding: 14px 20px; font-weight: 500">Reseñas</sc-raw-th></sc-raw-tr></sc-raw-thead>
<sc-raw-tbody>
<sc-for list="{{rest}}" as="r" hint-placeholder-count="7">
<sc-raw-tr style="border-top: 1px solid #F6E9E1; background: {{r.bg}}">
<sc-raw-td style="padding: 14px 20px; font-weight: 700; color: #6B5248">{{r.pos}}</sc-raw-td>
<sc-raw-td style="padding: 14px"><span style="display: flex; align-items: center; gap: 10px"><span style="width: 34px; height: 34px; border-radius: 50%; background: #FDE4E2; color: #991B1B; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.ini}}</span><span style="font-weight: {{r.weight}}">{{r.name}}</span></span></sc-raw-td>
<sc-raw-td style="padding: 14px"><span style="display: flex; align-items: center; gap: 4px; font-weight: 700"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="#F59E0B" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7-6.2-3.6-6.2 3.6 1.4-7L2 9.3l7-.8z"></path></svg>{{r.rating}}</span></sc-raw-td>
<sc-raw-td style="padding: 14px">{{r.pools}}</sc-raw-td>
<sc-raw-td style="padding: 14px 20px">{{r.reviews}}</sc-raw-td>
</sc-raw-tr>
</sc-for>
</sc-raw-tbody>
</sc-raw-table>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1140}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { zone: 'Zona Centro' };
  }
  renderVals() {
    var self = this, z = this.state.zone;
    var zones = ['Zona Centro', 'Zona Norte', 'Zona Sur', 'Zona Este', 'Zona Oeste'];
    var base = [
      ['Nicolás Torres', 'NT', '5,0', 41, 58], ['Santiago Ríos', 'SR', '4,9', 37, 52], ['Lucía Gómez', 'LG', '4,8', 32, 47],
      ['Abril Bustos', 'AB', '4,8', 28, 39], ['Martina Paz', 'MP', '4,7', 25, 41], ['Micaela Vera (vos)', 'MV', '4,7', 31, 38],
      ['Julián Díaz', 'JD', '4,6', 19, 27], ['Camila Fernández', 'CF', '4,5', 22, 30], ['Rocío Villalba', 'RV', '4,5', 15, 21], ['Tomás Acuña', 'TA', '4,4', 12, 18]
    ];
    var shift = zones.indexOf(z);
    var list = base.slice();
    if (shift > 0) {
      var others = list.filter(function (x) { return x[1] !== 'MV'; });
      var rot = others.slice(shift).concat(others.slice(0, shift));
      list = rot.slice(0, 9);
    }
    var podBg = ['#FFE9E0', '#FFF4EC', '#FFF8F4'], ring = ['#DE3A3A', '#EA6A1F', '#F59E0B'], hs = ['300px', '270px', '250px'];
    var order = [1, 0, 2];
    return {
      zones: zones.map(function (n) {
        var on = n === z;
        return { label: n, sel: on ? 'true' : 'false', bg: on ? '#1F1512' : '#FFFFFF', color: on ? '#FFFFFF' : '#1F1512', border: on ? '#1F1512' : '#F0DFD5', pick: function () { self.setState({ zone: n }); } };
      }),
      podium: order.map(function (i) {
        var p = list[i];
        return { name: p[0], ini: p[1], rating: p[2], pools: p[3], reviews: p[4], pos: i + 1, bg: podBg[i], ring: ring[i], h: hs[i] };
      }),
      rest: list.slice(3).map(function (p, i) {
        var me = p[1] === 'MV';
        return { pos: i + 4, name: p[0], ini: p[1], rating: p[2], pools: p[3], reviews: p[4], bg: me ? '#FDECEA' : '#FFFFFF', weight: me ? 700 : 500 };
      })
    };
  }
}
</script>


</body></html>
