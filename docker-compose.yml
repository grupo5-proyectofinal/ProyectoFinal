# Levanta todo con `docker compose up --build`:
#   frontend  http://localhost:5173
#   backend   http://localhost:8000/api/v1/
#   db        localhost:${POSTGRES_PORT:-5432}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Dentro de la red de compose la base es `db:5432`, sin importar POSTGRES_PORT (puerto del host).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # El proxy de Vite conserva el Host público; sin esto Django responde DisallowedHost.
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # El proxy de Vite apunta al contenedor del backend.
      API_URL: http://backend:8000
      # Docker en Windows/OneDrive no avisa los cambios de archivos: se consulta por polling.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  media:
