<div style="min-height: 100vh; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; color: #1F1512">
<dc-import name="Header" active="mispools" back="{{ true }}" hint-size="100%,76px"></dc-import>

<main style="max-width: 920px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 20px; border-radius: 20px; background: #FFE9E0">
<span style="flex: none; width: 64px; height: 64px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" sc-camel-view-box="0 0 24 24" fill="none" stroke="#DE3A3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>
<div style="flex: 1 1 300px">
<span style="display: inline-block; padding: 3px 10px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #4A3A33">Finalizado · 02/10/2026</span>
<h1 style="margin: 6px 0 2px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">¿Cómo te fue con este pool?</h1>
<p style="margin: 0; font-size: 15px; color: #5C4038">Fideos Lucchetti (x 10 unid.) · Tus calificaciones ayudan a armar el ranking de la zona.</p>
</div>
</div>

<sc-for list="{{people}}" as="p" hint-placeholder-count="4">
<section style="border: 1px solid #F0E0D6; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<span style="flex: none; width: 48px; height: 48px; border-radius: 50%; background: {{p.bg}}; color: {{p.fg}}; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.ini}}</span>
<div style="flex: 1 1 200px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><b style="font-size: 17px">{{p.name}}</b><span style="padding: 2px 9px; border-radius: 999px; background: {{p.roleBg}}; color: {{p.roleColor}}; font-size: 12px; font-weight: 700">{{p.role}}</span></div>
<div style="font-size: 13px; color: #6B5248">{{p.detail}}</div>
</div>
<div role="radiogroup" aria-label="Calificación" style="display: flex; align-items: center; gap: 2px">
<sc-for list="{{p.stars}}" as="s" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.label}}" sc-camel-on-click="{{s.pick}}" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" sc-camel-view-box="0 0 24 24" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7-6.2-3.6-6.2 3.6 1.4-7L2 9.3l7-.8z"></path></svg></button>
</sc-for>
<span style="width: 92px; padding-left: 8px; font-size: 14px; font-weight: 700; color: #C2410C">{{p.word}}</span>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500; color: #4A3A33">Reseña (opcional)
<textarea rows="2" placeholder="{{p.placeholder}}" style="padding: 12px; border: 1px solid #F0DFD5; border-radius: 10px; font: inherit; font-size: 15px; color: #1F1512; resize: vertical"></textarea>
</label>
</section>
</sc-for>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 14px; color: #6B5248">{{progress}}</span>
<div style="display: flex; gap: 10px">
<a href="MisPools.dc.html" style="display: flex; align-items: center; height: 52px; padding: 0 20px; border-radius: 14px; border: 1px solid #F0DFD5; color: #1F1512; text-decoration: none; font-weight: 700">Más tarde</a>
<a href="Ranking.dc.html" style="display: flex; align-items: center; height: 52px; padding: 0 28px; border-radius: 14px; background: #DE3A3A; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">Enviar calificaciones</a>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1180}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { r: { 0: 5, 1: 4 } };
  }
  renderVals() {
    var self = this, r = this.state.r;
    var words = ['', 'Muy malo', 'Malo', 'Regular', 'Bueno', 'Excelente'];
    var cols = [['#FDE4E2', '#991B1B'], ['#FFEDD5', '#9A3412'], ['#F6EFEB', '#4A3A33'], ['#FDDCCB', '#9A3412']];
    var people = [
      ['Lucía Gómez', 'LG', 'Administradora', 'Creó y gestionó el pool · 32 pools completados', '¿Cómo organizó la compra y la entrega?'],
      ['Martina Paz', 'MP', 'Participante', 'Se llevó 2 paquetes', '¿Pagó y retiró a tiempo?'],
      ['Julián Díaz', 'JD', 'Participante', 'Se llevó 2 paquetes', '¿Pagó y retiró a tiempo?'],
      ['Abril Bustos', 'AB', 'Participante', 'Se llevó 4 paquetes', '¿Pagó y retiró a tiempo?']
    ];
    var done = Object.keys(r).length;
    return {
      progress: 'Calificaste a ' + done + ' de ' + people.length + ' personas.',
      people: people.map(function (p, i) {
        var v = r[i] || 0, admin = i === 0;
        return {
          name: p[0], ini: p[1], role: p[2], detail: p[3], placeholder: p[4],
          bg: cols[i % 4][0], fg: cols[i % 4][1],
          roleBg: admin ? '#DE3A3A' : '#F6EFEB', roleColor: admin ? '#FFFFFF' : '#4A3A33',
          word: words[v] || 'Sin calificar',
          stars: [1, 2, 3, 4, 5].map(function (n) {
            return {
              label: n + (n === 1 ? ' estrella' : ' estrellas'), checked: v === n ? 'true' : 'false',
              fill: n <= v ? '#F59E0B' : 'none', stroke: n <= v ? '#F59E0B' : '#C9B8AE',
              pick: function () { var x = Object.assign({}, r); x[i] = n; self.setState({ r: x }); }
            };
          })
        };
      })
    };
  }
}
</script>
