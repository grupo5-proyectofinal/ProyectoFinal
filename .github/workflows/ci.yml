name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: poolshop
          POSTGRES_USER: poolshop
          POSTGRES_PASSWORD: poolshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poolshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-solo-para-tests
      DEBUG: "true"
      POSTGRES_DB: poolshop
      POSTGRES_USER: poolshop
      POSTGRES_PASSWORD: poolshop
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check . --extend-ignore EXE001
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    name: Frontend (node --test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
