# Levanta todo con `docker compose up --build`:
#   frontend  http://localhost:5173
#   backend   http://localhost:8000/api/v1/
#   db        localhost:${POSTGRES_PORT:-5432}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Dentro de la red de compose la base es `db:5432`, sin importar POSTGRES_PORT (puerto del host).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # El proxy de Vite conserva el Host público (localhost o la IP de la red, por ej.
      # 192.168.1.28 al probar desde el celular). En desarrollo se aceptan todos.
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Tareas periódicas (caducidad de pools, recordatorios): cada hora.
  scheduler:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
    # Espera a que el backend termine de migrar antes de la primera corrida.
    command: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do sleep 5; done; while true; do python manage.py tareas_periodicas; sleep 3600; done"]
    depends_on:
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      # El proxy de Vite apunta al contenedor del backend.
      API_URL: http://backend:8000
      # Docker en Windows/OneDrive no avisa los cambios de archivos: se consulta por polling.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  media:
