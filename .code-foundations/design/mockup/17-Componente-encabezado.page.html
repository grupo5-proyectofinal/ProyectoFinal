<script type="text/x-dc" data-dc-script="" data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;explorar&quot;,&quot;mispools&quot;,&quot;mensajes&quot;,&quot;ranking&quot;,&quot;notificaciones&quot;,&quot;ninguno&quot;],&quot;default&quot;:&quot;inicio&quot;},&quot;back&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:76}}">
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'inicio';
    var items = [
      { key: 'inicio', label: 'Inicio', href: 'Main.dc.html' },
      { key: 'explorar', label: 'Explorar', href: 'Explorar.dc.html' },
      { key: 'mispools', label: 'Mis Pools', href: 'MisPools.dc.html' },
      { key: 'ranking', label: 'Ranking', href: 'Ranking.dc.html' }
    ];
    return {
      back: this.props.back ?? false,
      bellBg: active === 'notificaciones' ? '#FDECEA' : 'transparent',
      chatBg: active === 'mensajes' ? '#FDECEA' : 'transparent',
      nav: items.map(function (i) {
        var on = i.key === active;
        return { label: i.label, href: i.href, weight: on ? 700 : 500, color: on ? '#B42318' : '#4A3A33', bg: on ? '#FDECEA' : 'transparent' };
      })
    };
  }
}
</script>
